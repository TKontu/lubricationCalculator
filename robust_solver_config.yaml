# Solver configuration optimized for the RobustNonLinearSolver
# These settings are designed to handle more complex or stiff networks
# that may struggle to converge with default parameters.

solver_config:
  max_iterations: 200  # Increase max iterations to give the solver more time

  # Tighter convergence criteria to ensure a high-quality solution
  convergence:
    residual_tolerance: 1.0e-9
    relative_tolerance: 1.0e-8
    component_tolerance: 1.0e-6

  # A more aggressive line search strategy to help escape local minima
  line_search:
    method: "armijo"
    c1: 1.0e-5          # Slightly more aggressive than default
    alpha_min: 1.0e-12    # Allow smaller step sizes
    max_backtracks: 30    # Allow more attempts to find a good step

  # Jacobian update settings (no change needed here for now)
  jacobian:
    update_method: "analytical"
    finite_difference_step: 1.0e-8
    sparsity_detection: True
